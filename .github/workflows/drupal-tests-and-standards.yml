name: Tests
on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 06:00 UTC is 1:00 AM ET (EST) / 2:00 AM ET (EDT).
    - cron: '0 6 1 * *'
  push:
  pull_request:
    branches: [ 1.x ]
jobs:
  test-pr:
    if: ${{ github.event_name == 'pull_request' }}
    name: PR matrix | D${{ matrix.drupal_core }} | PHP${{ matrix.php_version }} | MariaDB${{ matrix.mariadb_version }}
    strategy:
      fail-fast: false
      matrix:
        drupal_core:
          - '10.6.x'
          - '11.3.x'
        php_version:
          - '8.2'
          - '8.3'
        mariadb_version:
          - '10.6'
        exclude:
          - drupal_core: '11.3.x'
            php_version: '8.2'
    uses: ./.github/workflows/drupal-test-runner.yml
    with:
      drupal_core: ${{ matrix.drupal_core }}
      php_version: ${{ matrix.php_version }}
      mariadb_version: ${{ matrix.mariadb_version }}

  test-full:
    if: ${{ github.event_name != 'pull_request' }}
    name: Full matrix | D${{ matrix.drupal_core }} | PHP${{ matrix.php_version }} | MariaDB${{ matrix.mariadb_version }}
    strategy:
      fail-fast: false
      matrix:
        drupal_core:
          - '10.1.x'
          - '10.2.x'
          - '10.3.x'
          - '10.4.x'
          - '10.5.x'
          - '10.6.x'
          - '11.1.x'
          - '11.2.x'
          - '11.3.x'
        php_version:
          - '8.2'
          - '8.3'
        mariadb_version:
          - '10.4'
          - '10.6'
        exclude:
          - drupal_core: '11.1.x'
            php_version: '8.2'
          - drupal_core: '11.1.x'
            mariadb_version: '10.4'
          - drupal_core: '11.2.x'
            php_version: '8.2'
          - drupal_core: '11.2.x'
            mariadb_version: '10.4'
          - drupal_core: '11.3.x'
            php_version: '8.2'
          - drupal_core: '11.3.x'
            mariadb_version: '10.4'
    uses: ./.github/workflows/drupal-test-runner.yml
    with:
      drupal_core: ${{ matrix.drupal_core }}
      php_version: ${{ matrix.php_version }}
      mariadb_version: ${{ matrix.mariadb_version }}
